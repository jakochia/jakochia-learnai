<!DOCTYPE html>
<html lang="en" data-theme="teens">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Jakochia LearnAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="index.html" class="brand">🧠 Jakochia<span>LearnAI</span></a>
  <div class="nav-links"><a href="register.html">Register</a></div>
</div></nav>
<div class="container auth-wrap">
  <div class="card">
    <h2 class="mb-16">Welcome back</h2>
    <p class="muted mb-24">Sign in to continue learning.</p>
    <form id="login-form" class="form">
      <div class="form-row"><label>Email</label><input class="input" type="email" name="email" required /></div>
      <div class="form-row"><label>Password</label><input class="input" type="password" name="password" required /></div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
    </form>
    <p class="muted mt-16 text-center">No account? <a href="register.html">Register</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
