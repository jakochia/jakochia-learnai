<!DOCTYPE html>
<html lang="en" data-theme="teens">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Planner — Jakochia LearnAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="dashboard.html" class="brand">🧠 Jakochia<span>LearnAI</span></a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="upload.html">Upload</a>
    <a href="chat.html">Chat</a>
    <a href="quiz.html">Quizzes</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="planner.html" class="active">Planner</a>
    <a href="#" id="logout">Logout</a>
  </div>
</div></nav>
<div class="container mt-24" style="max-width:820px;">
  <div class="card mb-16">
    <h2 class="mb-16">AI Study Planner</h2>
    <form id="plan-form" class="form">
      <div class="form-row"><label>Subject</label><input class="input" id="subject" required placeholder="e.g. CCNA" /></div>
      <div class="flex gap-16" style="flex-wrap:wrap;">
        <div class="form-row" style="flex:1; min-width:180px;"><label>Exam date</label><input class="input" id="exam" type="date" required /></div>
        <div class="form-row" style="flex:1; min-width:140px;"><label>Hours/day</label><input class="input" id="hours" type="number" step="0.5" value="1.5" min="0.5" /></div>
      </div>
      <button class="btn btn-primary" id="gen-btn" type="submit">Generate Plan</button>
    </form>
  </div>
  <div class="card" id="plan-card"><p class="muted">Your study plan will appear here.</p></div>
</div>
<script src="js/api.js"></script>
<script src="js/planner.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
