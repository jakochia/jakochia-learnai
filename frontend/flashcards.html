<!DOCTYPE html>
<html lang="en" data-theme="teens">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards — Jakochia LearnAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="dashboard.html" class="brand">🧠 Jakochia<span>LearnAI</span></a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="upload.html">Upload</a>
    <a href="chat.html">Chat</a>
    <a href="quiz.html">Quizzes</a>
    <a href="flashcards.html" class="active">Flashcards</a>
    <a href="planner.html">Planner</a>
    <a href="#" id="logout">Logout</a>
  </div>
</div></nav>
<div class="container mt-24" style="max-width:700px;">
  <div class="card mb-16">
    <h2 class="mb-16">Smart Flashcards</h2>
    <form id="gen-form" class="form">
      <div class="flex gap-16" style="flex-wrap:wrap;">
        <div class="form-row" style="flex:2; min-width:200px;"><label>Document</label><select class="select" id="doc-select"></select></div>
        <div class="form-row" style="flex:1; min-width:100px;"><label>Count</label><input class="input" type="number" id="count" value="10" min="1" max="30" /></div>
      </div>
      <button class="btn btn-primary" type="submit" id="gen-btn">Generate Flashcards</button>
    </form>
  </div>
  <div class="card mb-16">
    <div class="flex-between mb-16"><h3>Review</h3><span class="badge" id="counter">0/0</span></div>
    <div class="flashcard" id="fc">
      <div class="flashcard-inner">
        <div class="flashcard-face"><div id="fc-front">Click Generate to begin</div></div>
        <div class="flashcard-face flashcard-back"><div id="fc-back"></div></div>
      </div>
    </div>
    <div class="flex gap-8 mt-16" id="ratings" style="flex-wrap:wrap;"></div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/flashcards.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
